on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: cinq for ${{ matrix.host }} built on ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux]
        host: [x86_64-freebsd, aarch64-freebsd]
        include:
          - {system: x86_64-linux, os: ubuntu-latest}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@main
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix build .#${{ matrix.host }}
          tar -cf cinq-${{ matrix.host }}-built-on-${{ matrix.system }}.tar -C result .
      - uses: actions/upload-artifact@main
        with:
          path: cinq-${{ matrix.host }}-built-on-${{ matrix.system }}.tar
          archive: false
